<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>Dutch Subtitles</title>
</head>
<body class="popup-body">
<main class="popup-card">
  <h1>Dutch Subtitles</h1>
  <section id="setupPanel" class="setup-panel">
    <div id="setupNative" class="setup-row">Native host</div>
    <div id="setupBackend" class="setup-row">Backend process</div>
    <div id="setupModels" class="setup-row">Models ready</div>
    <div id="setupPermissions" class="setup-row">Tab permission</div>
  </section>
  <div class="button-group">
    <button id="startBackendBtn">Start backend</button>
    <button id="restartBackendBtn">Restart backend</button>
    <button id="stopBackendBtn">Stop backend</button>
    <button id="openWindowBtn">Open subtitle window</button>
  </div>
  <p id="status" class="muted"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
