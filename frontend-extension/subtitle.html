<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>Live Dutch Subtitles</title>
</head>
<body>
  <main class="app-shell">
    <details id="topPanel" class="toolbar top-panel" open>
      <summary class="top-panel-summary">
        <div>
          <h1>Live Dutch Subtitles</h1>
        </div>
        <span id="topPanelAction" class="top-panel-action">click to collapse</span>
      </summary>

      <div class="top-panel-body">
        <div class="controls">
        <label>
          Backend WebSocket
          <input id="backendUrl" value="ws://127.0.0.1:8000/ws/subtitles" />
        </label>
        <label>
          Translation
          <select id="targetLang" title="Only English is available with the installed model">
            <option value="en" selected>English (available)</option>
          </select>
        </label>
        <label>
          Mode
          <select id="qualityMode">
            <option value="fast">Low latency</option>
            <option value="balanced" selected>Balanced</option>
            <option value="quality">High accuracy</option>
          </select>
        </label>
        <label>
          Display
          <select id="displayMode">
            <option value="current">Current only</option>
            <option value="two-line">Two-line overlay</option>
            <option value="history">History sidebar</option>
            <option value="compact">Compact transcript</option>
          </select>
        </label>
        <label>
          Context hint
          <input id="contextPrompt" maxlength="600" placeholder="names, topic, jargon" />
        </label>
        <label>
          Monitor
          <input id="monitorVolume" type="range" min="0" max="1" step="0.05" value="1" />
        </label>
        <label class="inline-check">
          <input id="muteMonitor" type="checkbox" />
          Mute
        </label>
        <label class="inline-check">
          <input id="transcriptLogging" type="checkbox" />
          Log text
        </label>
        <label>
          Dutch font
          <input id="dutchFontSize" type="number" min="14" max="96" step="1" value="48" />
        </label>
        <label>
          Translation font
          <input id="translationFontSize" type="number" min="14" max="96" step="1" value="42" />
        </label>
        <button id="startBtn">Start capture</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="exportTxtBtn" type="button">Export TXT</button>
        <button id="exportVttBtn" type="button">Export VTT</button>
        <button id="exportSrtBtn" type="button">Export SRT</button>
          <section class="status-grid">
            <div><strong>Status:</strong> <span id="status">Idle</span></div>
            <div><strong>Audio:</strong> <span id="audioStatus">Not capturing</span></div>
            <div><strong>Latency:</strong> <span id="latency">—</span></div>
            <div><strong>Privacy:</strong> <span id="privacyStatus">Transcript text hidden in logs</span></div>
          </section>
        </div>

        <details class="glossary-drawer">
          <summary class="glossary-title">
            <span>Glossary</span>
            <span class="history-summary-right">session corrections</span>
          </summary>
          <div class="glossary-grid">
            <input id="glossaryPattern" placeholder="Dutch regex" />
            <input id="glossaryReplacement" placeholder="Replacement" />
            <button id="addGlossaryBtn" type="button">Add</button>
          </div>
          <div id="glossaryList" class="glossary-list"></div>
        </details>

      </div>

    </details>



    <section class="subtitle-panel">
      <div class="header-row">
        <span>Current subtitle</span>
        <span id="qualityBadge" class="quality-badge good">Quality: waiting</span>
      </div>

      <article id="currentSubtitle" class="current-subtitle empty">
        <div class="placeholder">Waiting for Dutch speech…</div>
      </article>

      <details id="historyDrawer" class="history-drawer">
        <summary class="history-title">
          <span>History</span>
          <span class="history-summary-right">
            <span id="historyCount">0 previous subtitles</span>
            <span class="history-action">click to open</span>
          </span>
        </summary>
        <div id="historySubtitles" class="history-subtitles"></div>
      </details>


    </section>
  </main>

  <script src="audio-client.js"></script>
  <script src="backend-client.js"></script>
  <script src="subtitle-renderer.js"></script>
  <script src="settings.js"></script>
  <script src="subtitle.js"></script>
</body>
</html>
